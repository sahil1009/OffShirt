<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CART</title>
  <link rel="stylesheet" href="../CSS/cart.css">
</head>
<body>
  <section class="cart-container">

    <div class="cart-items">

        <h1>SHOPPING BAG</h1>

        <div class="cart-item">

            <img src="../IMG/imgWomen/shirts-hover/shirt2h.avif" alt="">

            <div class="item-details">
                <h3>Relaxed Fit Shirt</h3>
                <p>Size: M</p>
                <p>Colour: Black</p>

                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <a href="#">Remove</a>
            </div>

            <div class="price">
                ₹39.99
            </div>

        </div>

        <div class="cart-item">

            <img src="../IMG/imgMen/jeans-hover/jeans8h.avif" alt="">

            <div class="item-details">
                <h3>Wide Leg Jeans</h3>
                <p>Size: 32</p>
                <p>Colour: Blue</p>

                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <a href="#">Remove</a>
            </div>

            <div class="price">
                ₹59.99
            </div>

        </div>

    </div>

    <div class="cart-summary">

        <h2>ORDER SUMMARY</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span>₹99.98</span>
        </div>

        <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span>₹99.98</span>
        </div>

        <button class="checkout-btn">
            PROCEED TO CHECKOUT
        </button>

        <a href="../index.html">
          <button class="continue-btn">
            CONTINUE SHOPPING
        </button>
        </a>
        

    </div>

</section>
</body>
</html>
